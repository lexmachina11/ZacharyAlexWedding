<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Wedding photo and video gallery."
    >

    <title>Alex & Zachary — Wedding Gallery</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="top-bar">
        <a class="couple-name" href="#top">
            Alex &amp; Zachary
        </a>

        <p class="wedding-date">
            May 30, 2026
        </p>
    </header>

    <main id="top">
        <!--
            The hero video is intentionally hard-coded rather than loaded
            from gallery.json.
        -->
        <section class="hero" aria-label="Wedding film">
            <video
                class="hero-video"
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
            >
                <source
                    src="media/hero-wedding-film.mp4"
                    type="video/mp4"
                >

                Your browser does not support HTML video.
            </video>

            <div class="hero-overlay" aria-hidden="true"></div>

            <div class="hero-content">
                <p class="hero-kicker">Our Wedding</p>
                <h1>Alex &amp; Zachary</h1>
            </div>
        </section>

        <nav
            class="category-nav"
            aria-label="Wedding gallery categories"
        >
            <div class="category-nav-inner">
                <a href="#getting-ready">Getting Ready</a>
                <a href="#ceremony">Ceremony</a>
                <a href="#reception">Reception</a>
                <a href="#videos">Videos</a>
            </div>
        </nav>

        <div
            id="gallery"
            class="gallery-container"
            aria-live="polite"
        >
            <p class="gallery-status">Loading gallery…</p>
        </div>
    </main>

    <!-- Media lightbox -->
    <div
        id="lightbox"
        class="lightbox"
        role="dialog"
        aria-modal="true"
        aria-hidden="true"
        aria-label="Media viewer"
    >
        <button
            id="lightbox-close"
            class="lightbox-close"
            type="button"
            aria-label="Close viewer"
        >
            &times;
        </button>

        <div
            id="lightbox-content"
            class="lightbox-content"
        ></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
